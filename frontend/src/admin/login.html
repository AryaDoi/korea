<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Warung RMB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login_admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Warung RMB Admin</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-login">Login</button>
            </form>
            <p class="login-note">Default: admin / admin123</p>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const response = await api.adminLogin(username, password);
                localStorage.setItem('admin_session', response.data.session_id);
                showNotification('Login berhasil', 'success');
                setTimeout(() => {
                    window.location.href = '/admin/index.html';
                }, 1000);
            } catch (error) {
                showNotification(error.message || 'Login gagal', 'error');
            }
        });
    </script>
</body>
</html>
