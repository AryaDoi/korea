<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan - Warung RMB Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/edit_admin.css">
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>Warung RMB</h2>
                <span class="admin-label">Admin Panel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/index.html" class="nav-link">Dashboard</a>
                <a href="/admin/orders.html" class="nav-link active">Pesanan</a>
                <a href="javascript:void(0)" onclick="logout()" class="nav-link">Logout</a>
            </nav>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <h1>Manajemen Pesanan</h1>
                <div class="admin-user"><span id="admin-user-info">Admin</span></div>
            </header>
            <div class="admin-content">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Cari pesanan...">
                    <button id="search-btn">Cari</button>
                </div>
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>No. Pesanan</th>
                            <th>Nama Penerima</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody"></tbody>
                </table>
                <div id="order-modal" class="modal" style="display: none;">
                    <div class="modal-content">
                        <span class="close" onclick="closeOrderModal()">&times;</span>
                        <div id="order-detail-content"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/edit_admin.js"></script>
</body>
</html>
