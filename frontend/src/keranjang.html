<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - Warung RMB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/keranjang.css">
</head>
<body>
    <header class="navbar">
        <a href="/index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 16px;">
            <img src="/images/logo.png" alt="Logo Warung RMB" style="height: 75px; width: auto;">
            <div class="logo-text"><h1 style="margin: 0; line-height: 1.2;">Warung RMB</h1></div>
        </a>
        <nav class="nav-links"><a href="/index.html">Beranda</a><a href="/katalog.html">Katalog</a></nav>
    </header>
    <div class="container">
        <h1>Keranjang Belanja</h1>
        <div id="empty-cart" class="empty-state"><p>Keranjang Anda kosong</p><a href="/katalog.html" class="btn btn-primary">Belanja Sekarang</a></div>
        <div id="cart-content" class="cart-content" style="display: none;">
            <table class="cart-table">
                <thead><tr><th>Produk</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th><th>Aksi</th></tr></thead>
                <tbody id="cart-items"></tbody>
            </table>
            <div class="cart-summary">
                <div class="summary-row"><span>Subtotal:</span><span id="subtotal">Rp 0</span></div>
                <div class="summary-row"><span>Ongkir:</span><span id="ongkir">Rp 5.000</span></div>
                <div class="summary-row total"><span>Total:</span><span id="total">Rp 0</span></div>
                <button id="checkout-btn" class="btn btn-primary btn-large">Lanjut ke Checkout</button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2024 Warung RMB. All rights reserved.</p></footer>
    <script src="/js/api.js"></script>
    <script src="/js/keranjang.js"></script>
</body>
</html>
